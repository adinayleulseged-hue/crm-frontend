server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/insa_crm
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  cache:
    type: caffeine

app:
  jwt:
    secret: insaErpCrmSecretKeyForJwtTokenGeneration2025VeryLongSecretKey
    expiration-ms: 86400000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.insa.crm: DEBUG
    org.springframework.security: INFO
